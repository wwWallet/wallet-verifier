name: Bug report
description: Create a report to help us improve
title: ""
labels: []
assignees: []
body:
  - type: textarea
    id: describe-the-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.

  - type: textarea
    id: to-reproduce
    attributes:
      label: To Reproduce
      description: "Steps to reproduce the behavior:"
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: environment-information
    attributes:
      label: Environment information (if available)
      placeholder: |
        - wallet-verifier version or commit:
        - Deployment method: [Docker / source]
        - Docker image tag/version (if using Docker):
        - Node version (if running without Docker):
        - Server OS:

  - type: textarea
    id: desktop
    attributes:
      label: Desktop
      description: "Please complete the following information:"
      placeholder: |
        - OS: [e.g. iOS]
        - Browser [e.g. chrome, safari]
        - Version [e.g. 22]

  - type: textarea
    id: smartphone
    attributes:
      label: Smartphone
      description: "Please complete the following information:"
      placeholder: |
        - Device: [e.g. iPhone6]
        - OS: [e.g. iOS8.1]
        - Browser [e.g. stock browser, safari]
        - Version [e.g. 22]

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
